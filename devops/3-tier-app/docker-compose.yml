services:
  db:
    image: postgres:16-alpine
    ports: 
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    env_file:
      - ./backend/.env 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy 
    restart: unless-stopped 
    ports: 
      - 8000:8000
    env_file:
      - ./backend/.env
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    ports: 
      - 80:80
    restart: unless-stopped
volumes: 
  postgres_data: